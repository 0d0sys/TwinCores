[Rainmeter]
Update=1000
AccurateText=1
DefaultWindowX=(#ArtX#)
DefaultWindowY=(#ArtY#)
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1][!ClickThrough 0]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; SPOTIFY STAGE - Round 13. Enlarged panel hosting the canvas/
; music-video stage: a WebView2 window plays the current track's
; Canvas (extracted by the Spicetify extension -> local bridge
; server -> stage.html). When no canvas is live the panel falls
; back to the big album art (>=180px locked) + WebNowPlaying info.
; Stage geometry: 308x548 (9:16) at (16,8); controls below.
; ------------------------------------------------------------

[MeasureWNP]
Measure=Plugin
Plugin=WebNowPlaying

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress

[MeasureStatus]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Status

[CalcActive]
Measure=Calc
Formula=MeasureStatus > 0 ? 1 : 0

[CalcPlaying]
Measure=Calc
Formula=MeasureState = 1 ? 1 : 0

; --- canvas bridge ---

; WebView2 stage window. HostPath serves @Resources\Canvas over a
; virtual http origin so the page can fetch the bridge (a file://
; page would be blocked from calling http://127.0.0.1).
; Clickthrough=2: the stage is interactive (click = play/pause);
; hold CTRL to drag the skin by the video.
[MeasureWebView]
Measure=Plugin
Plugin=WebView2
HostPath=#@#Canvas
URL=stage.html
HostSecurity=0
HostOrigin=0
X=16
Y=8
W=308
H=548
AutoStart=1
Hidden=1
Clickthrough=2
ZoomControl=0
NewWindow=0
DynamicVariables=1

; polls the bridge for {"url": "..."} via curl (Windows ships curl)
[MeasureCanvasPoll]
Measure=Plugin
Plugin=RunCommand
Parameter=curl -s --max-time 3 http://127.0.0.1:8795/canvas
State=Hide
OutputType=ANSI
Timeout=4000
FinishAction=[!CommandMeasure Logic "Polled()"]

[Logic]
Measure=Script
ScriptFile=#@#Scripts\CanvasWatch.lua

; --- panel ---

[Panel]
Meter=Shape
AntiAlias=1
GlassFace=270 | #GlassTop#,#GlassAlpha# ; 0.0 | #GlassBottom#,#GlassAlpha# ; 1.0
Shape=Rectangle 0,0,#ArtW#,#ArtH#,10 | Fill LinearGradient GlassFace | Stroke Color #Accent#,90 | StrokeWidth 1
LeftMouseUpAction=["#SpotifyPath#"]
ToolTipText=Open Spotify

; backing for the video stage (also the letterbox color)
[StageBack]
Meter=Shape
AntiAlias=1
Shape=Rectangle 16,8,308,548,6 | Fill Color #Base#,190 | Stroke Color #LineC#,140 | StrokeWidth 1

; --- fallback: big album cover (hidden while a canvas plays) ---

[Art]
Meter=Image
MeasureName=MeasureCover
X=18
Y=130
W=304
H=304

[ArtFrame]
Meter=Shape
AntiAlias=1
Shape=Rectangle 18,130,304,304,6 | Fill Color 0,0,0,1 | Stroke Color #LineC#,180 | StrokeWidth 1

[Idle]
Meter=String
MeterStyle=WDim
X=170
Y=274
W=#ArtW#
H=16
StringAlign=Center
Text=NOTHING PLAYING
DynamicVariables=1
Hidden=[CalcActive]

; --- track info ---

[Title]
Meter=String
MeterStyle=WText
X=16
Y=564
W=308
H=18
FontSize=11
MeasureName=MeasureTitle
Text=%1
ToolTipText=Now playing title

[Artist]
Meter=String
MeterStyle=WDim
X=16
Y=586
W=308
H=14
MeasureName=MeasureArtist
Text=%1

; --- transport: prev | play/pause | next (96x36 buttons) ---

[BtnPrev]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Shape=Rectangle 16,608,96,36,6 | Fill Color #Panel#,190 | Stroke Color #Accent#,130 | StrokeWidth 1
Shape2=Rectangle 42,618,3,16,1 | Fill Color #TextC#,220 | StrokeWidth 0
TriPrev=60,618 | LineTo 60,632 | LineTo 49,625
Shape3=Path TriPrev | Fill Color #TextC#,220 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]
ToolTipText=Previous track

[BtnPlay]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Shape=Rectangle 122,608,96,36,6 | Fill Color #Panel#,190 | Stroke Color #Accent#,130 | StrokeWidth 1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "PlayPause"]
ToolTipText=Play / pause

[IconPlay]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Hidden=(1-[CalcPlaying])
TriPlay=162,618 | LineTo 162,632 | LineTo 175,625
Shape=Path TriPlay | Fill Color #Accent#,255 | StrokeWidth 0

[IconPause]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Hidden=[CalcPlaying]
Shape=Rectangle 158,618,4,16,1 | Fill Color #Accent#,255 | StrokeWidth 0
Shape2=Rectangle 168,618,4,16,1 | Fill Color #Accent#,255 | StrokeWidth 0

[BtnNext]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Shape=Rectangle 228,608,96,36,6 | Fill Color #Panel#,190 | Stroke Color #Accent#,130 | StrokeWidth 1
Shape2=Rectangle 286,618,3,16,1 | Fill Color #TextC#,220 | StrokeWidth 0
TriNext=268,618 | LineTo 268,632 | LineTo 279,625
Shape3=Path TriNext | Fill Color #TextC#,220 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]
ToolTipText=Next track

[Progress]
Meter=Bar
MeasureName=MeasureProgress
MaxValue=100
X=16
Y=652
W=308
H=5
BarColor=#Accent#,200
SolidColor=#LineC#,150
BarOrientation=Horizontal
