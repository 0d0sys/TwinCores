; Modern InputText plugin: activation = ExecuteBatch 1; the typed text
; arrives as $UserInput$ in Command1. Enter commits, Escape cancels.
; FocusDismiss=1 (default): clicking anywhere outside the box dismisses
; it - no more Rainmeter-wide mouse lock while a line is open. Typed
; text is only kept on Enter (plugin cannot expose it on dismiss).
[AgendaInput]
Measure=Plugin
Plugin=InputText
X=20
Y=(#AgendaH#-38)
W=(#AgendaW#-40)
H=26
FontFace=#DataFont#
FontSize=10
FontColor=#TextC#
SolidColor=#Panel#
DefaultValue=
FocusDismiss=1
OnDismissAction=[!CommandMeasure Logic "OnDismiss()"]
Command1=[!SetVariable TypedText "$UserInput$"][!CommandMeasure Logic "Commit()"]
