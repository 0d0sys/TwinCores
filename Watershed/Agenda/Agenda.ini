[Rainmeter]
Update=1000
AccurateText=1
DefaultWindowX=(#AgendaX#)
DefaultWindowY=(#AgendaY#)
DefaultAlwaysOnTop=0
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1][!ClickThrough 0]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; AGENDA - Sapline. One horizontal strand: done events dim left,
; the next event is brightest, NOW slides forward.
; Runs at NORMAL z-order (0) - on-desktop / on-bottom pins break
; InputText keyboard focus. Click anywhere on the panel to add:
; type "hh:mm event", or just a title.
; ------------------------------------------------------------

[Logic]
Measure=Script
ScriptFile=#@#Scripts\Sapline.lua

[Panel]
Meter=Shape
AntiAlias=1
GlassFace=270 | #GlassTop#,#GlassAlpha# ; 0.0 | #GlassBottom#,#GlassAlpha# ; 1.0
Shape=Rectangle 0,0,#AgendaW#,#AgendaH#,10 | Fill LinearGradient GlassFace | Stroke Color #Accent#,80 | StrokeWidth 1
Shape2=Rectangle 5,5,(#AgendaW#-10),(#AgendaH#-10),8 | Fill Color 0,0,0,1 | Stroke Color #Accent#,30 | StrokeWidth 1 | StrokeDashes 12,8
LeftMouseUpAction=[!CommandMeasure Logic "Add()"]
ToolTipText=Click to add: hh:mm title (today) | mm/dd title (future) | +N title (days ahead) | tomorrow title.\nRight-click a dot, label or upcoming entry to delete it.

[Header]
Meter=String
MeterStyle=WHeader
X=22
Y=10
W=160
H=24
FontSize=14
Text=AGENDA

[AddBtn]
Meter=String
MeterStyle=WDim
X=110
Y=14
W=60
H=18
FontColor=#Accent3#,230
Text=+ ADD
LeftMouseUpAction=[!CommandMeasure Logic "Add()"]
MouseOverAction=[!SetOption AddBtn FontColor "#Accent3#,255"][!Redraw]
MouseLeaveAction=[!SetOption AddBtn FontColor "#Accent3#,230"][!Redraw]
ToolTipText=Add an event: hh:mm title (today) | mm/dd title (future) | +N title (days ahead).

