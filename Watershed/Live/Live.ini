[Rainmeter]
Update=100
AccurateText=1
OnRefreshAction=[!Move "0" "0"][!ZPos -1][!Draggable 0][!ClickThrough 1]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; LIVE - the living layer of the watershed, pinned to the desktop
; (under every window and widget, over the wallpaper). Click-through.
; Fireflies (forest) - flow streaks (crest) - plankton (deep)
; one traveling pulse, source to deep. LUMEN = LOAD.
; ------------------------------------------------------------

[Logic]
Measure=Script
ScriptFile=#@#Scripts\WatershedLive.lua

; invisible full-canvas backing so the skin spans 3840x1080
[Canvas]
Meter=Shape
AntiAlias=1
Shape=Rectangle 0,0,3840,1080 | Fill Color 0,0,0,1 | StrokeWidth 0

