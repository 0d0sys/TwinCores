[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!ZPos -2][!Draggable 0][!ClickThrough 1]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; LOAD - hidden hub skin. LUMEN = LOAD.
; Reads CPU/RAM, smooths, broadcasts Lumen to every Watershed skin.
; Rainmeter deactivates meterless skins - keep a 1x1 invisible anchor.
; ------------------------------------------------------------

[MeasureCPU]
Measure=CPU

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMUsed]
Measure=PhysicalMemory

[CalcRAM]
Measure=Calc
Formula=MeasureRAMUsed / MeasureRAMTotal * 100

; Round 13: launch the local canvas bridge (canvas-bridge.py) once per
; refresh. `start` detaches so RunCommand returns immediately; the
; server itself exits silently if the port is already owned.
[MeasureBridge]
Measure=Plugin
Plugin=RunCommand
; NOTE: cmd /c start silently failed ("access is denied") and wscript
; is disabled on this Win11 build - a tiny python launcher detaches
; the server with DETACHED_PROCESS instead (zero quoting traps).
Parameter=C:\Python315\python.exe "#@#Scripts\canvas-bridge-launch.py"
State=Hide
OutputType=ANSI
Timeout=4000
UpdateDivider=-1

[Logic]
Measure=Script
ScriptFile=#@#Scripts\Lumen.lua

[Anchor]
Meter=Shape
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,1 | StrokeWidth 0
