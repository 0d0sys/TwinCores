[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=(#SysX#)
DefaultWindowY=(#SysY#)
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1][!ClickThrough 0]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc
; dial geometry (Round 12: three 270-deg gauges)
GCX1=95
GCX2=230
GCX3=365
GCY=150
GR=52
NL=40

; ------------------------------------------------------------
; SYSTEM - Round 12: three realtime dial gauges (CPU / RAM / DISK)
; driven by SystemGauges.lua (needle rotation + value arc), plus
; network speeds and uptime.
; ------------------------------------------------------------

[MeasureCPU]
Measure=CPU

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMUsed]
Measure=PhysicalMemory

[CalcRAM]
Measure=Calc
Formula=MeasureRAMUsed / MeasureRAMTotal * 100

[CalcRAMFrac]
Measure=Calc
Formula=MeasureRAMUsed / MeasureRAMTotal

[MeasureDiskFree]
Measure=FreeDiskSpace
Disk=1

[MeasureDiskTotal]
Measure=FreeDiskSpace
Disk=1
Total=1

[CalcDiskFrac]
Measure=Calc
Formula=1 - MeasureDiskFree / MeasureDiskTotal

[CalcDiskPct]
Measure=Calc
Formula=(1 - MeasureDiskFree / MeasureDiskTotal) * 100

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureUpTime]
Measure=UpTime
Format=%4!i!d %3!i!h

[Logic]
Measure=Script
ScriptFile=#@#Scripts\SystemGauges.lua

[Panel]
Meter=Shape
AntiAlias=1
GlassFace=270 | #GlassTop#,#GlassAlpha# ; 0.0 | #GlassBottom#,#GlassAlpha# ; 1.0
Shape=Rectangle 0,0,#SysW#,#SysH#,10 | Fill LinearGradient GlassFace | Stroke Color #Accent#,80 | StrokeWidth 1

[Header]
Meter=String
MeterStyle=WHeader
X=16
Y=8
W=140
H=20
FontSize=13
Text=SYSTEM

[ValUp]
Meter=String
MeterStyle=WDim
X=(#SysW#-16)
Y=12
W=150
H=14
StringAlign=Right
FontSize=10
MeasureName=MeasureUpTime
FontColor=#Accent3#,220
Text=%1

; --- dial tracks ---

[DialCPU]
Meter=Shape
AntiAlias=1
Shape=Ellipse #GCX1#,#GCY#,#GR# | Fill Color #Panel#,110 | Stroke Color #LineC#,170 | StrokeWidth 2
Shape2=Ellipse #GCX1#,#GCY#,(#GR#-13) | Fill Color 0,0,0,1 | Stroke Color #LineC#,90 | StrokeWidth 1 | StrokeDashes 4,7

[DialRAM]
Meter=Shape
AntiAlias=1
Shape=Ellipse #GCX2#,#GCY#,#GR# | Fill Color #Panel#,110 | Stroke Color #LineC#,170 | StrokeWidth 2
Shape2=Ellipse #GCX2#,#GCY#,(#GR#-13) | Fill Color 0,0,0,1 | Stroke Color #LineC#,90 | StrokeWidth 1 | StrokeDashes 4,7

[DialDisk]
Meter=Shape
AntiAlias=1
Shape=Ellipse #GCX3#,#GCY#,#GR# | Fill Color #Panel#,110 | Stroke Color #LineC#,170 | StrokeWidth 2
Shape2=Ellipse #GCX3#,#GCY#,(#GR#-13) | Fill Color 0,0,0,1 | Stroke Color #LineC#,90 | StrokeWidth 1 | StrokeDashes 4,7

; --- value arcs (Lua-built, hidden until value > ~1%) ---

[ArcCPU]
Meter=Shape
AntiAlias=1
Hidden=1
DynamicVariables=1

[ArcRAM]
Meter=Shape
AntiAlias=1
Hidden=1
DynamicVariables=1

[ArcDisk]
Meter=Shape
AntiAlias=1
Hidden=1
DynamicVariables=1

; --- needles + hubs (TransformationMatrix set by Lua) ---

[NeedleCPU]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Shape=Line #GCX1#,#GCY#,#GCX1#,(#GCY#-#NL#) | Stroke Color #Accent# | StrokeWidth 4 | StrokeEndCap Round
Shape2=Ellipse #GCX1#,#GCY#,5 | Fill Color #Accent# | Stroke Color #Base#,180 | StrokeWidth 1

[NeedleRAM]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Shape=Line #GCX2#,#GCY#,#GCX2#,(#GCY#-#NL#) | Stroke Color #Accent2# | StrokeWidth 4 | StrokeEndCap Round
Shape2=Ellipse #GCX2#,#GCY#,5 | Fill Color #Accent2# | Stroke Color #Base#,180 | StrokeWidth 1

[NeedleDisk]
Meter=Shape
AntiAlias=1
DynamicVariables=1
Shape=Line #GCX3#,#GCY#,#GCX3#,(#GCY#-#NL#) | Stroke Color #Accent3# | StrokeWidth 4 | StrokeEndCap Round
Shape2=Ellipse #GCX3#,#GCY#,5 | Fill Color #Accent3# | Stroke Color #Base#,180 | StrokeWidth 1

; --- labels + values ---

[LabCPU]
Meter=String
MeterStyle=WDim
X=(#GCX1#-40)
Y=80
W=80
H=14
StringAlign=Center
Text=CPU

[ValCPU]
Meter=String
MeterStyle=WValue
X=(#GCX1#-40)
Y=212
W=80
H=18
StringAlign=Center
MeasureName=MeasureCPU
Text=%1

[LabRAM]
Meter=String
MeterStyle=WDim
X=(#GCX2#-40)
Y=80
W=80
H=14
StringAlign=Center
Text=RAM

[ValRAM]
Meter=String
MeterStyle=WValue
X=(#GCX2#-40)
Y=212
W=80
H=18
StringAlign=Center
MeasureName=CalcRAM
Text=%1

[LabDisk]
Meter=String
MeterStyle=WDim
X=(#GCX3#-40)
Y=80
W=80
H=14
StringAlign=Center
Text=DISK

[ValDisk]
Meter=String
MeterStyle=WValue
X=(#GCX3#-40)
Y=212
W=80
H=18
StringAlign=Center
MeasureName=CalcDiskPct
Text=%1

[Divider]
Meter=Shape
AntiAlias=1
Shape=Line 16,244,(#SysW#-16),244 | Stroke Color #LineC#,90 | StrokeWidth 1

[NetDLab]
Meter=String
MeterStyle=WDim
X=16
Y=256
W=44
H=14
Text=DOWN

[NetDVal]
Meter=String
MeterStyle=WValue
X=64
Y=254
W=130
H=16
FontSize=11
MeasureName=MeasureNetIn
AutoScale=1
NumeralFormat=K
Text=%1

[NetULab]
Meter=String
MeterStyle=WDim
X=230
Y=256
W=30
H=14
Text=UP

[NetUVal]
Meter=String
MeterStyle=WValue
X=264
Y=254
W=170
H=16
FontSize=11
MeasureName=MeasureNetOut
AutoScale=1
NumeralFormat=K
Text=%1
