[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=(#GlemCX#-60)
DefaultWindowY=(#GlemCY#-60)
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc
CoreColor=#Accent2#
OrbMode=VPN

; ------------------------------------------------------------
; PROTON VPN orb (repurposed GLEM core, the deep / private side).
; Status = the 'ProTUN' tunnel adapter: up = bright glowing pulse,
; down = dim ember. Click opens the Proton VPN app (v5 has no CLI,
; so the actual connect/disconnect happens in the app - honest limit).
; ------------------------------------------------------------

[Logic]
Measure=Script
ScriptFile=#@#Scripts\NetOrb.lua

[MeasurePoll]
Measure=Plugin
Plugin=RunCommand
Parameter=netsh interface show interface
State=Hide
OutputType=ANSI
Timeout=5000
FinishAction=[!CommandMeasure Logic "Polled()"]

[Base]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,#OrbCY#,#OrbR# | Fill Color #Panel#,150 | Stroke Color #CoreColor#,80 | StrokeWidth 2
LeftMouseUpAction=["#ProtonVPNPath#"]
ToolTipText=PROTON VPN - glow = tunnel active. Click opens the Proton VPN app (toggle the tunnel there - v5 has no command line).

[PulseRing]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,#OrbCY#,(#OrbR#+9) | Fill Color 0,0,0,1 | Stroke Color #CoreColor#,60 | StrokeWidth 3
DynamicVariables=1

[HaloRing]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,#OrbCY#,(#OrbR#+23) | Fill Color 0,0,0,1 | Stroke Color #CoreColor#,25 | StrokeWidth 1
DynamicVariables=1

; Round 12: theme-matched center icon - padlock (tunnel closed = good)
[Icon]
Meter=Shape
AntiAlias=1
Shape=Arc (#OrbCX#-14),(#OrbCY#-11),(#OrbCX#+14),(#OrbCY#-11),16,16,*,0,0,* | Stroke Color #CoreColor#,225 | StrokeWidth 5 | StrokeStartCap Round | StrokeEndCap Round
Shape2=Rectangle (#OrbCX#-18),(#OrbCY#-11),36,30,5 | Fill Color #CoreColor#,215 | StrokeWidth 0
Shape3=Ellipse #OrbCX#,(#OrbCY#+1),4.5 | Fill Color #Base#,235
Shape4=Line #OrbCX#,(#OrbCY#+4),#OrbCX#,(#OrbCY#+13) | Stroke Color #Base#,235 | StrokeWidth 4

[Name]
Meter=String
MeterStyle=WDim
X=(#OrbCX#)
Y=188
W=150
H=16
StringAlign=Center
FontSize=11
FontColor=#CoreColor#,220
Text=PROTON VPN

[StateText]
Meter=String
MeterStyle=WDim
X=(#OrbCX#)
Y=204
W=150
H=14
StringAlign=Center
FontSize=9
DynamicVariables=1

[DetailText]
Meter=String
MeterStyle=WDim
X=(#OrbCX#)
Y=220
W=150
H=14
StringAlign=Center
FontSize=9
DynamicVariables=1
