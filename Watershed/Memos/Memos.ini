[Rainmeter]
Update=1000
AccurateText=1
DefaultWindowX=(#MemoX#)
DefaultWindowY=(#MemoY#)
DefaultAlwaysOnTop=0
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1][!ClickThrough 0]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; MEMOS - click-and-type notes on the sea floor (monitor 2).
; Normal z-order (0), never on-desktop pinned (InputText focus fix).
; Click anywhere on the panel to type; Enter saves, Ctrl+Enter newline.
; ------------------------------------------------------------

[Logic]
Measure=Script
ScriptFile=#@#Scripts\WatershedMemos.lua

[Panel]
Meter=Shape
AntiAlias=1
GlassFace=270 | #GlassTop#,#GlassAlpha# ; 0.0 | #GlassBottom#,#GlassAlpha# ; 1.0
Shape=Rectangle 0,0,#MemoW#,#MemoH#,10 | Fill LinearGradient GlassFace | Stroke Color #Accent#,80 | StrokeWidth 1
Shape2=Rectangle 5,5,(#MemoW#-10),(#MemoH#-10),8 | Fill Color 0,0,0,1 | Stroke Color #Accent#,30 | StrokeWidth 1 | StrokeDashes 12,8
ToolTipText=Click the note body to type (Enter saves). Click a NOTE tab to switch.
; NOTE: no mouse action on the panel shape itself - in Rainmeter the
; FIRST meter in the file that is under the cursor receives the click,
; so a panel-wide action here would swallow the tab / body clicks.

[Header]
Meter=String
MeterStyle=WHeader
X=20
Y=8
W=160
H=20
FontSize=13
Text=MEMOS

[Tab1]
Meter=String
MeterStyle=WText
X=20
Y=32
W=140
H=18
FontSize=9
FontColor=#DimC#
Text=NOTE 01
LeftMouseUpAction=[!CommandMeasure Logic "Select(1)"]
ToolTipText=Switch to note 1
DynamicVariables=1

[Tab2]
Meter=String
MeterStyle=WText
X=180
Y=32
W=140
H=18
FontSize=9
FontColor=#DimC#
Text=NOTE 02
LeftMouseUpAction=[!CommandMeasure Logic "Select(2)"]
ToolTipText=Switch to note 2
DynamicVariables=1

[Tab3]
Meter=String
MeterStyle=WText
X=340
Y=32
W=140
H=18
FontSize=9
FontColor=#DimC#
Text=NOTE 03
LeftMouseUpAction=[!CommandMeasure Logic "Select(3)"]
ToolTipText=Switch to note 3
DynamicVariables=1

[TabUnderline]
Meter=Shape
AntiAlias=1
Shape=Line 20,38,120,38 | Stroke Color #Accent#,208 | StrokeWidth 2
DynamicVariables=1

[NoteBody]
Meter=String
MeterStyle=WText
X=20
Y=52
W=(#MemoW#-64)
H=(#MemoH#-98)
FontSize=10
LineHeight=15
FontColor=#TextC#,225
ClipString=2
LeftMouseUpAction=[!CommandMeasure Logic "Edit()"]
MouseScrollUpAction=[!CommandMeasure Logic "Scroll(-2)"]
MouseScrollDownAction=[!CommandMeasure Logic "Scroll(2)"]
ToolTipText=Click to type (Enter saves, Ctrl+Enter newline). Wheel scrolls.
DynamicVariables=1

[ScrollTrack]
Meter=Shape
AntiAlias=1
Shape=Line (#MemoW#-16),52,(#MemoW#-16),(#MemoH#-46) | Stroke Color #DimC#,50 | StrokeWidth 2
LeftMouseUpAction=[!CommandMeasure Logic "Edit()"]

[ScrollThumb]
Meter=Shape
AntiAlias=1
Shape=Rectangle (#MemoW#-17),52,2,16,1 | Fill Color #Accent#,170 | StrokeWidth 0
DynamicVariables=1

[ClickTop]
Meter=Shape
AntiAlias=1
; height stays above the tab row (tabs start at y=32) so this catcher
; can never overlap - or swallow - the NOTE 01/02/03 tab clicks,
; regardless of which overlap rule this build uses for mouse input
Shape=Rectangle 0,0,#MemoW#,30,1 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Logic "Edit()"]

[ClickBottom]
Meter=Shape
AntiAlias=1
Shape=Rectangle 0,(#MemoH#-36),#MemoW#,36,1 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Logic "Edit()"]

[MemoPage]
Meter=String
MeterStyle=WDim
X=20
Y=(#MemoH#-24)
W=300
H=14

; Modern InputText plugin: activation = ExecuteBatch 1; typed text
; arrives as $UserInput$ in Command1. Enter saves, Ctrl+Enter newline.
; FocusDismiss=1: clicking anywhere outside the box dismisses it - the
; Rainmeter-wide mouse lock is gone. Typed text is only kept on Enter
; (the plugin cannot expose it on dismiss).
[MemoInput]
Measure=Plugin
Plugin=InputText
X=20
Y=52
W=(#MemoW#-64)
H=(#MemoH#-98)
FontFace=#DataFont#
FontSize=9
FontColor=#TextC#
SolidColor=#Panel#
DefaultValue=
FocusDismiss=1
OnDismissAction=[!CommandMeasure Logic "OnDismiss()"]
Command1=[!SetVariable MemoTyped "$UserInput$"][!CommandMeasure Logic "Commit()"]
