[Rainmeter]
Update=1000
AccurateText=1
DefaultWindowX=(#SecX#)
DefaultWindowY=(#SecY#)
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1][!ClickThrough 0]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; SECONDARY - Brave. Round 13: quick-link grid REMOVED (user:
; the pertinent links live in Comms - the panel goes back to a
; sleek ring card that blends into the deep).
; Click-routing note (Round 11 rule): the visual [Panel] has NO
; mouse action - clicks are owned by the dedicated hit meters.
; ------------------------------------------------------------

; whole-panel hit - launches Brave
[PanelHit]
Meter=Shape
AntiAlias=1
Shape=Rectangle 0,0,#SecW#,#SecH#,12 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["#SecondaryPath#"]
ToolTipText=Open Brave (secondary program)

[Panel]
Meter=Shape
AntiAlias=1
GlassFace=270 | #GlassTop#,#GlassAlpha# ; 0.0 | #GlassBottom#,#GlassAlpha# ; 1.0
Shape=Rectangle 0,0,#SecW#,#SecH#,12 | Fill LinearGradient GlassFace | Stroke Color #Accent2#,90 | StrokeWidth 1
Shape2=Rectangle 5,5,(#SecW#-10),(#SecH#-10),10 | Fill Color 0,0,0,1 | Stroke Color #Accent2#,36 | StrokeWidth 1 | StrokeDashes 12,8

[Header]
Meter=String
MeterStyle=WHeader
X=22
Y=14
W=240
H=26
FontSize=21
Text=#SecondaryLabel#

[Sub]
Meter=String
MeterStyle=WDim
X=23
Y=48
W=380
H=14
Text=SECONDARY PROGRAM - THE DEPTH

; --- hero ring with the Brave lion (click = launch) ---

[Ring]
Meter=Shape
AntiAlias=1
Shape=Ellipse 210,182,96 | Fill Color #Panel#,120 | Stroke Color #Accent2#,36 | StrokeWidth 15
Shape2=Ellipse 210,182,96 | Fill Color 0,0,0,1 | Stroke Color #Accent2#,110 | StrokeWidth 1
Shape3=Ellipse 210,182,72 | Fill Color 0,0,0,1 | Stroke Color #Accent2#,44 | StrokeWidth 1 | StrokeDashes 12,8
LeftMouseUpAction=["#SecondaryPath#"]
ToolTipText=Open Brave

[Lion]
Meter=Image
AntiAlias=1
ImageName=#@#Icons\brave-lion.png
X=160
Y=123
W=101
H=118
LeftMouseUpAction=["#SecondaryPath#"]
ToolTipText=Open Brave

[Hint]
Meter=String
MeterStyle=WDim
X=210
Y=298
W=420
H=12
StringAlign=Center
Text=CLICK THE SHIELD TO OPEN BRAVE
