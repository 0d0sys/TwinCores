[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=(#EmberCX#-60)
DefaultWindowY=(#EmberCY#-60)
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc
CoreColor=#Accent3#
OrbMode=NET

; ------------------------------------------------------------
; NETWORK orb (repurposed EMBER core, source shore / work side).
; Wired / Wi-Fi / offline state + live down-up speed. Glow = connected.
; Click opens Windows network settings (where you join Wi-Fi or wire).
; Status polled by NetOrb.lua via netsh every 5 s.
; ------------------------------------------------------------

[Logic]
Measure=Script
ScriptFile=#@#Scripts\NetOrb.lua

[MeasurePoll]
Measure=Plugin
Plugin=RunCommand
Parameter=netsh interface show interface
State=Hide
OutputType=ANSI
Timeout=5000
FinishAction=[!CommandMeasure Logic "Polled()"]

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[CalcNetIn]
Measure=Calc
Formula=MeasureNetIn / 1024

[CalcNetOut]
Measure=Calc
Formula=MeasureNetOut / 1024

[Base]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,#OrbCY#,#OrbR# | Fill Color #Panel#,150 | Stroke Color #CoreColor#,80 | StrokeWidth 2
LeftMouseUpAction=["ms-settings:network-wifi"]
ToolTipText=NETWORK - click to open Windows network settings (join Wi-Fi or wired)

[PulseRing]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,#OrbCY#,(#OrbR#+9) | Fill Color 0,0,0,1 | Stroke Color #CoreColor#,60 | StrokeWidth 3
DynamicVariables=1

[HaloRing]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,#OrbCY#,(#OrbR#+23) | Fill Color 0,0,0,1 | Stroke Color #CoreColor#,25 | StrokeWidth 1
DynamicVariables=1

; Round 12: theme-matched center icon - WI-FI waves over a node dot
[Icon]
Meter=Shape
AntiAlias=1
Shape=Ellipse #OrbCX#,(#OrbCY#+10),5 | Fill Color #CoreColor#,235
Shape2=Arc (#OrbCX#-14.1),(#OrbCY#-4.1),(#OrbCX#+14.1),(#OrbCY#-4.1),20,20,*,0,0,* | Stroke Color #CoreColor#,225 | StrokeWidth 4 | StrokeStartCap Round | StrokeEndCap Round
Shape3=Arc (#OrbCX#-25.5),(#OrbCY#-15.5),(#OrbCX#+25.5),(#OrbCY#-15.5),36,36,*,0,0,* | Stroke Color #CoreColor#,225 | StrokeWidth 4 | StrokeStartCap Round | StrokeEndCap Round

[Name]
Meter=String
MeterStyle=WDim
X=(#OrbCX#)
Y=188
W=150
H=16
StringAlign=Center
FontSize=11
FontColor=#CoreColor#,220
Text=NETWORK

[StateText]
Meter=String
MeterStyle=WDim
X=(#OrbCX#)
Y=204
W=150
H=14
StringAlign=Center
FontSize=9
DynamicVariables=1

[DetailText]
Meter=String
MeterStyle=WDim
X=(#OrbCX#)
Y=220
W=150
H=14
StringAlign=Center
FontSize=9
DynamicVariables=1
