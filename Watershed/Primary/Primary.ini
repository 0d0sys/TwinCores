[Rainmeter]
Update=1000
AccurateText=1
DefaultWindowX=(#PrimX#)
DefaultWindowY=(#PrimY#)
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=0
OnRefreshAction=[!ZPos 0][!Draggable 1][!ClickThrough 0]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; PRIMARY PROGRAM - Bionic (locked). Center panel of the source.
; Click anywhere on the panel to launch.
; ------------------------------------------------------------

[MeasureCPU]
Measure=CPU

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMUsed]
Measure=PhysicalMemory

[CalcRAM]
Measure=Calc
Formula=MeasureRAMUsed / MeasureRAMTotal * 100

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[CalcNetIn]
Measure=Calc
Formula=MeasureNetIn / 1024

[CalcNetOut]
Measure=Calc
Formula=MeasureNetOut / 1024

[MeasureUpTime]
Measure=UpTime
Format=%4!i!d %3!i!h

[MeasureDiskFree]
Measure=FreeDiskSpace
Disk=1

[MeasureDiskTotal]
Measure=FreeDiskSpace
Disk=1
Total=1

[CalcDiskFrac]
Measure=Calc
Formula=1 - MeasureDiskFree / MeasureDiskTotal

; Round 12 click-routing: the visual panel has NO action - clicks are
; owned by dedicated hit meters (Memos rule: avoid first-in-file fights)
[PanelHit]
Meter=Shape
AntiAlias=1
Shape=Rectangle 0,0,#PrimW#,#PrimH#,14 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=["#PrimaryPath#"]
ToolTipText=Open Bionic (primary program)

[Panel]
Meter=Shape
AntiAlias=1
GlassFace=270 | #GlassTop#,#GlassAlpha# ; 0.0 | #GlassBottom#,#GlassAlpha# ; 1.0
Shape=Rectangle 0,0,#PrimW#,#PrimH#,14 | Fill LinearGradient GlassFace | Stroke Color #Accent#,90 | StrokeWidth 1
Shape2=Rectangle 6,6,(#PrimW#-12),(#PrimH#-12),11 | Fill Color 0,0,0,1 | Stroke Color #Accent#,36 | StrokeWidth 1 | StrokeDashes 12,8

[Header]
Meter=String
MeterStyle=WHeader
X=24
Y=16
W=300
H=30
FontSize=21
Text=#PrimaryLabel#
AntiAlias=1

; --- Round 12: the little Bionic worker (mascot, theme-cut PNG) ---

[WorkerShadow]
Meter=Shape
AntiAlias=1
Shape=Ellipse 77,296,26,5 | Fill Color #Base#,150 | StrokeWidth 0

[Worker]
Meter=Image
AntiAlias=1
ImageName=#@#Icons\bionic-worker.png
X=30
Y=210
W=94
H=84
LeftMouseUpAction=["#PrimaryPath#"]
ToolTipText=The Bionic worker - click to open Bionic

; --- Round 12: right-column readouts (uptime + disk) ---

[ColDivider]
Meter=Shape
AntiAlias=1
Shape=Line 368,166,368,286 | Stroke Color #LineC#,90 | StrokeWidth 1

[StatUp]
Meter=String
MeterStyle=WDim
X=376
Y=172
W=110
H=14
Text=UPTIME

[ValUp]
Meter=String
MeterStyle=WValue
X=376
Y=188
W=112
H=16
FontSize=12
MeasureName=MeasureUpTime
Text=%1

[StatDisk]
Meter=String
MeterStyle=WDim
X=376
Y=224
W=110
H=14
Text=DISK C:

[ValDisk]
Meter=String
MeterStyle=WValue
X=376
Y=240
W=104
H=16
FontSize=11
MeasureName=MeasureDiskFree
AutoScale=1
NumeralFormat=K
Text=%1B FREE

[BarDisk]
Meter=Bar
MeasureName=CalcDiskFrac
X=376
Y=262
W=100
H=4
BarColor=#Accent3#,210
SolidColor=#LineC#,130
BarOrientation=Horizontal

[Sub]
Meter=String
MeterStyle=WDim
X=25
Y=48
W=420
H=14
Text=PRIMARY PROGRAM - SOURCE OF THE WATERSHED

; --- load ring: LUMEN = LOAD, the ring's own light is the readout ---

[Ring]
Meter=Shape
AntiAlias=1
Shape=Ellipse 250,226,100 | Fill Color #Panel#,110 | Stroke Color #Accent#,#GlowA2# | StrokeWidth 14
Shape2=Ellipse 250,226,100 | Fill Color 0,0,0,1 | Stroke Color #Accent#,#GlowA# | StrokeWidth 2
DynamicVariables=1

[LoadBig]
Meter=String
MeterStyle=WValue
X=249
Y=202
W=#PrimW#
H=44
StringAlign=Center
FontSize=30
FontColor=#TextC#
Text=#LoadPct#
DynamicVariables=1

[LoadCap]
Meter=String
MeterStyle=WDim
X=249
Y=248
W=#PrimW#
H=14
StringAlign=Center
Text=SYSTEM LOAD

; --- bottom stats row ---

[StatCPU]
Meter=String
MeterStyle=WDim
X=40
Y=394
W=120
H=14
Text=CPU

[ValCPU]
Meter=String
MeterStyle=WValue
X=40
Y=412
W=120
H=20
MeasureName=MeasureCPU
Text=%1

[StatRAM]
Meter=String
MeterStyle=WDim
X=190
Y=394
W=120
H=14
Text=RAM

[ValRAM]
Meter=String
MeterStyle=WValue
X=190
Y=412
W=120
H=20
MeasureName=CalcRAM
Text=%1

[StatNET]
Meter=String
MeterStyle=WDim
X=340
Y=394
W=130
H=14
Text=NET

[ValNetIn]
Meter=String
MeterStyle=WValue
X=340
Y=412
W=130
H=18
MeasureName=CalcNetIn
AutoScale=1
NumeralFormat=K
FontSize=11
