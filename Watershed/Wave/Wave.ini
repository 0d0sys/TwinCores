[Rainmeter]
Update=40
AccurateText=1
DynamicWindowSize=1
DefaultWindowX=(#WaveX#)
DefaultWindowY=(#WaveY#)
DefaultAlwaysOnTop=-2
DefaultDraggable=0
DefaultSnapEdges=0
OnRefreshAction=[!Move "(#WaveX#)" "(#WaveY#)"][!ZPos -2][!Draggable 0][!ClickThrough 1]

[Variables]
@Include=#@#variables.inc
@Include2=#@#Watershed.inc

; ------------------------------------------------------------
; WAVE - full-width realtime audio waveform across the watershed.
; 128 bands, mirrored bars around a center line at y=890, spanning
; all 3840px, behind every widget. Click-through. On Desktop z-order.
; Band range is 30-6000 Hz on purpose: AudioLevel bands are LINEAR in
; frequency, so at 15 kHz almost all musical energy sat in the first
; few bands and the rest of the strip looked flat. 0-6 kHz spreads
; bass/mids/vocals across all 128 bars; a rising per-band gain taper
; (0.70 -> 1.60) keeps the far right as lively as the bass.
; ------------------------------------------------------------

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTAttack=12
FFTDecay=280
Bands=128
FreqMin=30
FreqMax=6000
Sensitivity=40

[Band1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0
Channel=Avg

